MEMORY {
    ULTIMAX_LOADER:  start = $fc00,  size = $0300, fill = yes, fillval = $ff;
    ULTIMAX_CRT:     start = $ff00,  size =   $fa, fill = yes, fillval = $ff;
    ULTIMAX_VECTORS: start = $fffa,  size =     6, fill = yes, fillval = $ff;

    BOOTSTRAP:       file = "", start =  $100,  size =   $80;
    LOADER:          file = "", start = $c000,  size = $0300;
}

SEGMENTS {

    ULTIMAX_VECTORS: load = ULTIMAX_VECTORS, type = ro,  start = $fffa;
    ULTIMAX_CRT:     load = ULTIMAX_CRT,     type = ro,  align =  $100;
    LOADER:          load = ULTIMAX_LOADER   run = LOADER,      type = rw, define = yes;

    BOOTSTRAP:       load = ULTIMAX_CRT,     run = BOOTSTRAP,   type = rw, define = yes;
 
}
