    CODE:     file = %O, start = $c000, size = $0900, fill = yes;
    RESULTS:  file = %O, start = $c900, size = $00f1;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = CODE,     type = rw;
    RESULTS:  load = RESULTS,  type = rw;
}
